<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flappy Bird</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    touch-action: none;
    user-select: none;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function() {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  const W = () => window.innerWidth;
  const H = () => window.innerHeight;
  const GROUND_H = 112;

  let bird = { x: 0, y: 0, w: 34, h: 24, vy: 0, gravity: 0.42, jump: -7.2 };
  let pipes = [];
  let score = 0;
  let highScore = 0;
  let frame = 0;
  let gameOver = false;
  let started = false;
  let bgOffset = 0;
  let groundOffset = 0;
  let clouds = [];
  let lastFlap = 0;

  const GAP = 165;
  const PIPE_W = 60;
  const PIPE_S = 2.6;

  function initClouds() {
    clouds = [];
    for (let i = 0; i < 8; i++) {
      clouds.push({
        x: Math.random() * W(),
        y: Math.random() * (H() * 0.45),
        s: 0.2 + Math.random() * 0.5,
        w: 40 + Math.random() * 80
      });
    }
  }

  function reset() {
    bird.x = W() * 0.22;
    bird.y = H() / 2;
    bird.vy = 0;
    pipes = [];
    score = 0;
    frame = 0;
    bgOffset = 0;
    groundOffset = 0;
    gameOver = false;
    started = false;
    initClouds();
  }
  reset();

  function flap() {
    if (gameOver) {
      reset();
      return;
    }
    if (!started) started = true;
    bird.vy = bird.jump;
    lastFlap = frame;
  }

  window.addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); flap(); } });
  window.addEventListener('mousedown', flap);
  window.addEventListener('touchstart', e => { e.preventDefault(); flap(); }, { passive: false });

  function spawnPipe() {
    const minTop = 60;
    const maxTop = H() - GROUND_H - GAP - minTop - 30;
    const topH = Math.floor(Math.random() * (maxTop - minTop) + minTop);
    pipes.push({ x: W() + 30, topH: topH, passed: false });
  }

  function update() {
    if (gameOver) return;

    if (started) {
      bird.vy += bird.gravity;
      bird.vy = Math.min(bird.vy, 10);
      bird.y += bird.vy;

      if (bird.y + bird.h / 2 > H() - GROUND_H) {
        bird.y = H() - GROUND_H - bird.h / 2;
        endGame();
      }
      if (bird.y - bird.h / 2 < 0) {
        bird.y = bird.h / 2;
        bird.vy = 0;
      }

      if (frame % 105 === 0) spawnPipe();

      for (let p of pipes) {
        p.x -= PIPE_S;
        if (!p.passed && p.x + PIPE_W < bird.x) {
          p.passed = true;
          score++;
          if (score > highScore) highScore = score;
        }
        if (bird.x + bird.w / 2 - 3 > p.x && bird.x - bird.w / 2 + 3 < p.x + PIPE_W) {
          if (bird.y - bird.h / 2 + 2 < p.topH || bird.y + bird.h / 2 - 2 > p.topH + GAP) {
            endGame();
          }
        }
      }
      pipes = pipes.filter(p => p.x + PIPE_W > -30);

      groundOffset -= PIPE_S;
      if (groundOffset <= -24) groundOffset += 24;
      bgOffset -= PIPE_S * 0.25;
      if (bgOffset <= -24) bgOffset += 24;

      for (let c of clouds) {
        c.x -= c.s;
        if (c.x + c.w < 0) { c.x = W() + c.w; c.y = Math.random() * (H() * 0.45); }
      }

      frame++;
    } else {
      bird.y = H() / 2 + Math.sin(frame * 0.05) * 8;
      frame++;
    }
  }

  function endGame() {
    gameOver = true;
    if (score > highScore) highScore = score;
  }

  function drawRoundedRect(x, y, w, h, r, fill, stroke) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.lineWidth = 2; ctx.strokeStyle = stroke; ctx.stroke(); }
  }

  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, H());
    g.addColorStop(0, '#4fc3f7');
    g.addColorStop(0.6, '#81d4fa');
    g.addColorStop(1, '#b3e5fc');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W(), H());
  }

  function drawCloud(x, y, w) {
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    const h = w * 0.35;
    ctx.ellipse(x, y, w * 0.5, h * 0.5, 0, 0, Math.PI * 2);
    ctx.ellipse(x + w * 0.25, y - h * 0.2, w * 0.35, h * 0.45, 0, 0, Math.PI * 2);
    ctx.ellipse(x - w * 0.25, y - h * 0.1, w * 0.3, h * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawHills() {
    ctx.fillStyle = '#a5d6a7';
    ctx.beginPath();
    ctx.moveTo(0, H() - GROUND_H);
    for (let x = 0; x <= W() + 20; x += 20) {
      const y = Math.sin((x + bgOffset * 3) * 0.006) * 18 + Math.cos((x + bgOffset * 3) * 0.012) * 10;
      ctx.lineTo(x, H() - GROUND_H - 40 + y);
    }
    ctx.lineTo(W(), H());
    ctx.lineTo(0, H());
    ctx.closePath();
    ctx.fill();
  }

  function drawGround() {
    const gh = GROUND_H;
    const y = H() - gh;
    ctx.fillStyle = '#ded895';
    ctx.fillRect(0, y, W(), gh);
    ctx.fillStyle = '#cbb968';
    ctx.fillRect(0, y + 12, W(), gh - 12);
    ctx.strokeStyle = '#5e4d25';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W(), y);
    ctx.stroke();

    for (let x = groundOffset % 24; x < W(); x += 24) {
      ctx.strokeStyle = 'rgba(94,77,37,0.3)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x, y + 12);
      ctx.lineTo(x - 8, y + gh);
      ctx.stroke();
    }

    ctx.fillStyle = 'rgba(0,0,0,0.08)';
    for (let x = (groundOffset * 1.5) % 30; x < W(); x += 30) {
      ctx.beginPath();
      ctx.ellipse(x, y + gh - 2, 6, 2, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawPipe(x, topH) {
    const pipeH = H() - GROUND_H;
    const capH = 24;
    const g1 = ctx.createLinearGradient(x, 0, x + PIPE_W, 0);
    g1.addColorStop(0, '#55b848');
    g1.addColorStop(0.5, '#74cf43');
    g1.addColorStop(1, '#55b848');

    ctx.fillStyle = g1;
    ctx.strokeStyle = '#2f6b21';
    ctx.lineWidth = 3;

    // top pipe
    ctx.fillRect(x, 0, PIPE_W, topH - capH);
    ctx.strokeRect(x, 0, PIPE_W, topH - capH);
    drawRoundedRect(x - 4, topH - capH, PIPE_W + 8, capH, 4, g1, '#2f6b21');

    // bottom pipe
    const bottomY = topH + GAP;
    const bottomH = pipeH - bottomY;
    ctx.fillRect(x, bottomY + capH, PIPE_W, bottomH - capH);
    ctx.strokeRect(x, bottomY + capH, PIPE_W, bottomH - capH);
    drawRoundedRect(x - 4, bottomY, PIPE_W + 8, capH, 4, g1, '#2f6b21');

    // highlight
    const hlX = x + 8;
    const hlW = 6;
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fillRect(hlX, 0, hlW, topH - capH);
    ctx.fillRect(hlX, bottomY + capH, hlW, bottomH - capH);
    drawRoundedRect(hlX, topH - capH, hlW, capH, 3, 'rgba(255,255,255,0.25)', null);
    drawRoundedRect(hlX, bottomY, hlW, capH, 3, 'rgba(255,255,255,0.25)', null);
  }

  function drawBird() {
    ctx.save();
    ctx.translate(bird.x, bird.y);
    const rot = Math.min(Math.PI / 3.5, Math.max(-Math.PI / 4, bird.vy * 0.06));
    ctx.rotate(rot);

    // tail
    ctx.fillStyle = '#e65100';
    ctx.strokeStyle = '#bf360c';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-14, -3);
    ctx.quadraticCurveTo(-26, -7, -25, 0);
    ctx.quadraticCurveTo(-26, 7, -14, 3);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // body
    const bg = ctx.createRadialGradient(-4, -5, 4, 0, 2, 17);
    bg.addColorStop(0, '#fff176');
    bg.addColorStop(0.5, '#fdd835');
    bg.addColorStop(1, '#fbc02d');
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.arc(0, 3, 16, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#f57f17';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    // belly patch
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath();
    ctx.ellipse(-3, 9, 9, 6, 0.2, 0, Math.PI * 2);
    ctx.fill();

    // wing
    const flapSpeed = 0.3;
    const wingAngle = gameOver ? 0.15 : Math.sin((frame - lastFlap) * flapSpeed) * 0.55;
    ctx.save();
    ctx.translate(-5, 5);
    ctx.rotate(wingAngle);
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#f57f17';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(0, 0, 12, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    // head
    const hx = 3, hy = -12;
    const hg = ctx.createRadialGradient(hx - 2, hy - 3, 2, hx, hy, 12);
    hg.addColorStop(0, '#fff176');
    hg.addColorStop(0.55, '#fdd835');
    hg.addColorStop(1, '#fbc02d');
    ctx.fillStyle = hg;
    ctx.beginPath();
    ctx.arc(hx, hy, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#f57f17';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    // beak (upper and lower)
    ctx.fillStyle = '#ff9800';
    ctx.strokeStyle = '#e65100';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(hx + 10, hy - 3);
    ctx.lineTo(hx + 21, hy);
    ctx.lineTo(hx + 10, hy + 1);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#e65100';
    ctx.beginPath();
    ctx.moveTo(hx + 10, hy + 1);
    ctx.lineTo(hx + 19, hy);
    ctx.lineTo(hx + 10, hy + 5);
    ctx.closePath();
    ctx.fill();

    // eye
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(hx + 5, hy - 4, 5.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#f57f17';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(hx + 7, hy - 4, 2.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(hx + 8, hy - 5.5, 1.5, 0, Math.PI * 2);
    ctx.fill();

    // soft shadow under the bird
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.beginPath();
    ctx.ellipse(0, 22, 14, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawScore() {
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.font = 'bold 48px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(score.toString(), W() / 2 + 2, 70 + 2);
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.strokeText(score.toString(), W() / 2, 70);
    ctx.fillText(score.toString(), W() / 2, 70);
  }

  function drawOutlinedText(text, x, y, fill, stroke, lw, font) {
    ctx.font = font;
    ctx.textAlign = 'center';
    ctx.fillStyle = fill;
    if (stroke && lw > 0) {
      ctx.lineWidth = lw;
      ctx.strokeStyle = stroke;
      ctx.strokeText(text, x, y);
    }
    ctx.fillText(text, x, y);
  }

  function drawMedal(x, y, r, s) {
    let color = null, shine = null;
    if (s >= 40) { color = '#cfd8dc'; shine = '#fff'; }
    else if (s >= 30) { color = '#ffd700'; shine = '#fff8a0'; }
    else if (s >= 20) { color = '#c0c0c0'; shine = '#f0f0f0'; }
    else if (s >= 10) { color = '#cd7f32'; shine = '#e6a86e'; }
    if (!color) return;

    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.arc(x + 3, y + 3, r, 0, Math.PI * 2);
    ctx.fill();

    const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.2, x, y, r);
    g.addColorStop(0, shine);
    g.addColorStop(0.6, color);
    g.addColorStop(1, '#6d4c41');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#5e4d25';
    ctx.lineWidth = 3;
    ctx.stroke();

    const sz = Math.floor(r * 1.0);
    ctx.font = `bold ${sz}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillText('★', x + 2, y + 2);
    ctx.fillStyle = '#5e4d25';
    ctx.fillText('★', x, y);
    ctx.textBaseline = 'alphabetic';
  }

  function drawOverlay() {
    if (!started && !gameOver) {
      drawOutlinedText('FLAPPY BIRD', W() / 2, H() / 2 - 90, '#fff', '#000', 4, 'bold 52px sans-serif');
      drawOutlinedText('Press Space / Tap to flap', W() / 2, H() / 2 - 20, '#fff', '#000', 3, 'bold 24px sans-serif');
    }

    if (gameOver) {
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fillRect(0, 0, W(), H());

      const cw = 300;
      const ch = 240;
      const cx = (W() - cw) / 2;
      const cy = (H() - ch) / 2;

      drawRoundedRect(cx + 4, cy + 6, cw, ch, 16, 'rgba(0,0,0,0.2)', null);
      drawRoundedRect(cx, cy, cw, ch, 16, '#ded895', '#5e4d25');
      drawRoundedRect(cx + 8, cy + 8, cw - 16, ch - 16, 12, '#f7f3d0', null);

      drawOutlinedText('GAME OVER', W() / 2, cy + 52, '#e53935', '#000', 4, 'bold 38px sans-serif');

      const medalX = cx + 60;
      const medalY = cy + 135;
      drawMedal(medalX, medalY, 34, score);
      if (score < 10) {
        ctx.font = 'bold 14px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#5e4d25';
        ctx.fillText('MEDAL', medalX, medalY - 45);
      }

      const scoreX = cx + cw - 65;
      ctx.textAlign = 'center';
      ctx.font = 'bold 18px sans-serif';
      ctx.fillStyle = '#e59d20';
      ctx.fillText('SCORE', scoreX, cy + 90);
      ctx.font = 'bold 34px sans-serif';
      ctx.fillStyle = '#fff';
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 3;
      ctx.strokeText(score.toString(), scoreX, cy + 125);
      ctx.fillText(score.toString(), scoreX, cy + 125);

      ctx.font = 'bold 18px sans-serif';
      ctx.fillStyle = '#e59d20';
      ctx.fillText('BEST', scoreX, cy + 158);
      ctx.font = 'bold 34px sans-serif';
      ctx.fillStyle = '#fff';
      ctx.strokeText(highScore.toString(), scoreX, cy + 193);
      ctx.fillText(highScore.toString(), scoreX, cy + 193);

      if (score > 0 && score === highScore) {
        const badgeW = 48;
        const badgeH = 20;
        const bx = scoreX + 45;
        const by = cy + 145;
        drawRoundedRect(bx - badgeW / 2, by - badgeH / 2, badgeW, badgeH, 6, '#e53935', '#000');
        ctx.font = 'bold 12px sans-serif';
        ctx.fillStyle = '#fff';
        ctx.fillText('NEW', bx, by + 4);
      }

      drawOutlinedText('Press Space / Tap to restart', W() / 2, cy + 210, '#5e4d25', null, 0, 'bold 20px sans-serif');
    }
  }

  function draw() {
    drawSky();
    clouds.sort((a, b) => a.y - b.y).forEach(c => drawCloud(c.x, c.y, c.w));
    drawHills();
    pipes.forEach(p => drawPipe(p.x, p.topH));
    drawGround();
    drawBird();
    drawScore();
    drawOverlay();
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  loop();
})();
</script>
</body>
</html>
